<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Sul Fluminense — Notícias da Região e do RJ</title>
    <meta name="description" content="As notícias mais importantes de Barra Mansa, Volta Redonda, Resende e todo o Sul Fluminense em tempo real.">
    <meta name="theme-color" content="#2563eb">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="icone.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] },
                    colors: {
                        primario: { light: '#3b82f6', DEFAULT: '#2563eb', dark: '#1d4ed8' },
                        sulfluminense: '#dc2626',
                        estadorj: '#f59e0b',
                        brasil: '#10b981'
                    }
                }
            }
        }
    </script>
    <style type="text/tailwindcss">
        @layer utilities {
            .card-shadow { @apply shadow-md hover:shadow-lg transition-all duration-300; }
            .scroll-h { overflow-x: auto; scrollbar-width: none; -ms-overflow-style: none; }
            .scroll-h::-webkit-scrollbar { display: none; }
            .tag-sul { @apply bg-sulfluminense text-white; }
            .tag-rj { @apply bg-estadorj text-white; }
            .tag-brasil { @apply bg-brasil text-white; }
        }
    </style>
</head>
<body class="font-sans bg-gray-50 text-gray-900 dark:bg-gray-900 dark:text-gray-100 transition-colors duration-300">
    <!-- Cabeçalho -->
    <header class="sticky top-0 z-50 bg-white/80 dark:bg-gray-900/80 backdrop-blur-md border-b border-gray-200 dark:border-gray-800">
        <div class="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between">
            <h1 class="text-xl font-bold text-primario">📰 Portal Sul Fluminense</h1>
            <button id="btnTema" class="p-2 rounded-full bg-gray-100 dark:bg-gray-800 hover:bg-gray-200 dark:hover:bg-gray-700 transition">🌙</button>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 py-6">
        <!-- Filtro de Cidades -->
        <section class="mb-8">
            <h2 class="sr-only">Filtrar por cidade</h2>
            <div class="scroll-h pb-2">
                <div class="flex gap-2" id="filtrosCidades">
                    <button data-cidade="Todas" class="px-4 py-2 rounded-full text-sm font-semibold bg-primario text-white">Todas</button>
                    <button data-cidade="Barra Mansa" class="px-4 py-2 rounded-full text-sm font-medium bg-gray-200 dark:bg-gray-800 hover:bg-gray-300 dark:hover:bg-gray-700">Barra Mansa</button>
                    <button data-cidade="Volta Redonda" class="px-4 py-2 rounded-full text-sm font-medium bg-gray-200 dark:bg-gray-800 hover:bg-gray-300 dark:hover:bg-gray-700">Volta Redonda</button>
                    <button data-cidade="Resende" class="px-4 py-2 rounded-full text-sm font-medium bg-gray-200 dark:bg-gray-800 hover:bg-gray-300 dark:hover:bg-gray-700">Resende</button>
                    <button data-cidade="Angra dos Reis" class="px-4 py-2 rounded-full text-sm font-medium bg-gray-200 dark:bg-gray-800 hover:bg-gray-300 dark:hover:bg-gray-700">Angra dos Reis</button>
                    <button data-cidade="Estado do Rio de Janeiro" class="px-4 py-2 rounded-full text-sm font-medium bg-gray-200 dark:bg-gray-800 hover:bg-gray-300 dark:hover:bg-gray-700">Estado RJ</button>
                </div>
            </div>
        </section>

        <!-- Carrossel de Destaques (Sul Fluminense) -->
        <section id="secaoDestaques" class="mb-10">
            <h2 class="text-lg font-bold mb-4 flex items-center gap-2">⭐ Destaques do Sul Fluminense</h2>
            <div id="destaques" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4"></div>
        </section>

        <!-- Lista de Todas as Notícias -->
        <section>
            <h2 class="text-lg font-bold mb-4">📰 Últimas Notícias</h2>
            <div id="listaNoticias" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5">
                <div class="col-span-full text-center py-10 text-gray-500">Carregando notícias...</div>
            </div>
        </section>
    </main>

    <footer class="mt-16 border-t border-gray-200 dark:border-gray-800 py-6 text-center text-sm text-gray-500">
        <p>Portal Sul Fluminense — Notícias agregadas automaticamente de fontes públicas.</p>
        <p>Atualizado a cada ~20 minutos.</p>
    </footer>

    <script>
        let todasNoticias = [];
        let filtroAtual = "Todas";

        // Troca de Tema
        const btnTema = document.getElementById("btnTema");
        if (localStorage.getItem("tema") === "escuro" ||
            (!localStorage.getItem("tema") && window.matchMedia("(prefers-color-scheme: dark)").matches)) {
            document.documentElement.classList.add("dark");
            btnTema.textContent = "☀️";
        }
        btnTema.onclick = () => {
            document.documentElement.classList.toggle("dark");
            const escuro = document.documentElement.classList.contains("dark");
            localStorage.setItem("tema", escuro ? "escuro" : "claro");
            btnTema.textContent = escuro ? "☀️" : "🌙";
            renderizar();
        };

        // Seletor de Cidades
        document.getElementById("filtrosCidades").onclick = e => {
            const btn = e.target.closest("button[data-cidade]");
            if (!btn) return;
            filtroAtual = btn.dataset.cidade;
            document.querySelectorAll("#filtrosCidades button").forEach(b => {
                b.classList.remove("bg-primario", "text-white", "font-semibold");
                b.classList.add("bg-gray-200", "dark:bg-gray-800", "font-medium");
            });
            btn.classList.remove("bg-gray-200", "dark:bg-gray-800", "font-medium");
            btn.classList.add("bg-primario", "text-white", "font-semibold");
            renderizar();
        };

        function getTagClasse(score) {
            if (score >= 10) return "tag-sul";
            if (score >= 5) return "tag-rj";
            return "tag-brasil";
        }

        function formatarData(dataStr) {
            try {
                const d = new Date(dataStr);
                const agora = new Date();
                const min = Math.floor((agora - d) / 60000);
                if (min < 60) return `há ${min} min`;
                if (min < 1440) return `há ${Math.floor(min/60)} h`;
                return d.toLocaleDateString("pt-BR");
            } catch { return dataStr; }
        }

        function criarCard(noticia, destaque = false) {
            const tagClasse = getTagClasse(noticia.score_relevancia);
            return `
                <article class="bg-white dark:bg-gray-800 rounded-2xl overflow-hidden card-shadow flex flex-col h-full">
                    ${noticia.imagem_url ? `<img src="${noticia.imagem_url}" alt="${noticia.titulo}" class="w-full h-48 object-cover" loading="lazy">` : ""}
                    <div class="p-4 flex flex-col flex-1">
                        <span class="inline-block px-3 py-1 rounded-full text-xs font-semibold mb-2 w-fit ${tagClasse}">${noticia.cidade_tag}</span>
                        <h3 class="font-bold text-lg leading-tight mb-2">${noticia.titulo}</h3>
                        <p class="text-sm text-gray-600 dark:text-gray-300 mb-3 flex-1">${noticia.resumo}</p>
                        <div class="flex items-center justify-between text-xs text-gray-500 dark:text-gray-400 mt-auto pt-2 border-t border-gray-100 dark:border-gray-700">
                            <span class="font-medium">${noticia.fonte_origem}</span>
                            <span>${formatarData(noticia.data_publicacao)}</span>
                        </div>
                        <a href="${noticia.url_original}" target="_blank" rel="noopener" class="mt-3 block text-center bg-primario/10 text-primario font-semibold py-2 rounded-xl hover:bg-primario/20 transition">📖 Ler notícia completa</a>
                    </div>
                </article>
            `;
        }

        function renderizar() {
            let filtradas = todasNoticias;
            if (filtroAtual !== "Todas") {
                filtradas = todasNoticias.filter(n => n.cidade_tag === filtroAtual);
            }
            const destaques = filtradas.filter(n => n.score_relevancia >= 10).slice(0, 5);
            const restantes = filtradas;

            document.getElementById("destaques").innerHTML = destaques.length
                ? destaques.map(n => criarCard(n, true)).join("")
                : "<p class='col-span-full text-gray-500'>Sem destaques no momento</p>";

            document.getElementById("listaNoticias").innerHTML = restantes.length
                ? restantes.map(n => criarCard(n)).join("")
                : "<p class='col-span-full text-center py-10 text-gray-500'>Nenhuma notícia encontrada para este filtro.</p>";
        }

        async function carregar() {
            try {
                const res = await fetch("dados_noticias.json?t=" + Date.now());
                todasNoticias = await res.json();
                renderizar();
            } catch (e) {
                document.getElementById("listaNoticias").innerHTML =
                    `<div class="col-span-full text-center py-10 text-red-500">⚠️ Não foi possível carregar as notícias. Tente novamente mais tarde.</div>`;
            }
        }

        // Instalação PWA
        if ("serviceWorker" in navigator) {
            window.addEventListener("load", () => {
                navigator.serviceWorker.register("sw.js").catch(() => {});
            });
        }
        carregar();
    </script>
</body>
</html>
