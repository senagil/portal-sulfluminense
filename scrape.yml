name: Atualizar Notícias
on:
  schedule:
    - cron: '*/20 * * * *'  # A cada 20 minutos
  workflow_dispatch:

jobs:
  coleta:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Instalar Python
        uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
      - name: Executar scraper
        run: python backend/scraper.py
      - name: Commit do JSON atualizado
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/dados_noticias.json
          git commit -m "🔄 Atualização automática de notícias" || true
          git push